<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stopwatch Full Screen – Timer</title>
  <link rel="stylesheet" href="css/fullscreen.css" />
</head>

<body>
  <main>
    <header class="main__hero">
      <a class="site_name" href="index.html">&#8592; Timer</a>
      <button class="fs-btn" id="fs_btn" aria-label="Toggle fullscreen" title="Toggle fullscreen">&#x26F6;</button>
    </header>

    <div class="subc subcontainer0">
      <div class="c0_bar" role="tablist" aria-label="Timer modes">
        <div class="link active_tab" id="sw_tab" role="tab" aria-selected="true" aria-controls="sw_div" tabindex="0">
          Stopwatch
        </div>
        <div class="link" id="cd_tab" role="tab" aria-selected="false" aria-controls="cd_div" tabindex="0">
          Countdown
        </div>
      </div>

      <!-- Stopwatch Panel -->
      <div id="sw_div" class="active_div" role="tabpanel" aria-labelledby="sw_tab">
        <div class="stopwatch" aria-label="Stopwatch display">
          <div class="sw_p1">
            <div class="time-unit">
              <span class="timer-text" id="stopwatch_hours">00</span>
              <span class="unit-label">hr</span>
            </div>
            <span class="separator">:</span>
            <div class="time-unit">
              <span class="timer-text" id="stopwatch_minutes">00</span>
              <span class="unit-label">min</span>
            </div>
            <span class="separator">:</span>
            <div class="time-unit">
              <div class="sec-ms">
                <span class="timer-text" id="stopwatch_seconds">00</span><span class="ms-comma">.<span id="stopwatch_milliseconds">00</span></span>
              </div>
              <span class="unit-label">sec</span>
            </div>
          </div>
        </div>
        <div class="sw-btns">
          <button class="ctrl-btn start-btn" id="start_sw" aria-label="Start stopwatch">Start</button>
          <button class="ctrl-btn clear-btn" id="clear_sw" aria-label="Clear stopwatch">Clear</button>
        </div>
      </div>

      <!-- Countdown Panel -->
      <div id="cd_div" role="tabpanel" aria-labelledby="cd_tab" hidden>
        <div class="countdown" id="countdown_display" aria-label="Countdown display">
          <div class="cd_p1">
            <div class="time-unit">
              <span class="timer-text" id="cd_hours">00</span>
              <span class="unit-label">hr</span>
            </div>
            <span class="separator">:</span>
            <div class="time-unit">
              <span class="timer-text" id="cd_minutes">00</span>
              <span class="unit-label">min</span>
            </div>
            <span class="separator">:</span>
            <div class="time-unit">
              <div class="sec-ms">
                <span class="timer-text" id="cd_seconds">00</span><span class="ms-comma">.<span id="cd_milliseconds">00</span></span>
              </div>
              <span class="unit-label">sec</span>
            </div>
          </div>
        </div>
        <div class="cd_keypad" role="group" aria-label="Countdown time entry keypad">
          <span id="btn_5" class="cd_cell" role="button" tabindex="0">5</span>
          <span id="btn_6" class="cd_cell" role="button" tabindex="0">6</span>
          <span id="btn_7" class="cd_cell" role="button" tabindex="0">7</span>
          <span id="btn_8" class="cd_cell" role="button" tabindex="0">8</span>
          <span id="btn_9" class="cd_cell" role="button" tabindex="0">9</span>
          <span id="btn_set" class="cd_cell" role="button" tabindex="0">Set</span>
          <span id="btn_0" class="cd_cell" role="button" tabindex="0">0</span>
          <span id="btn_1" class="cd_cell" role="button" tabindex="0">1</span>
          <span id="btn_2" class="cd_cell" role="button" tabindex="0">2</span>
          <span id="btn_3" class="cd_cell" role="button" tabindex="0">3</span>
          <span id="btn_4" class="cd_cell" role="button" tabindex="0">4</span>
          <span id="btn_clear" class="cd_cell" role="button" tabindex="0">Clear</span>
        </div>
        <div class="cd-btns">
          <div>
            <button class="ctrl-btn start-btn" id="start_cd" aria-label="Start countdown">Start</button>
            <button class="ctrl-btn clear-btn" id="clear_cd" aria-label="Reset countdown">Clear</button>
          </div>
          <div>
            <button class="back-btn" id="back_cd" aria-label="Go back to keypad">&#8678; Back</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>Designed by &copy; Mahmoud Esmat | &reg; MEM</p>
  </footer>

  <script src="js/stopwatch.js" defer></script>
  <script src="js/countdown.js" defer></script>
  <script src="js/tabs.js" defer></script>
  <script>
    const fsBtn = document.getElementById('fs_btn');
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        fsBtn.textContent = '\u233D'; // ⌽ exit icon
        fsBtn.title = 'Exit fullscreen';
      } else {
        document.exitFullscreen();
        fsBtn.textContent = '\u26F6'; // ⛶ enter icon
        fsBtn.title = 'Toggle fullscreen';
      }
    });
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        fsBtn.textContent = '\u26F6';
        fsBtn.title = 'Toggle fullscreen';
      }
    });
  </script>
</body>
</html>
